name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the published source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the distributable HTML
        run: npm run build:check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the public site
        run: |
          rm -rf _site
          mkdir -p _site/dist _site/src
          cp index.html device-check.html LICENSE _site/
          cp dist/paripari.html _site/dist/
          cp -R src/css src/js _site/src/

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
