name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
        env:
          PARIPARI_ARTIFACT_DIR: artifacts/r1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-browser-evidence
          path: artifacts/r1
          if-no-files-found: warn
